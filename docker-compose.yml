services:
  db:
    image: postgres:15-alpine
    container_name: smartaccounting-db-dev

    environment:
      POSTGRES_DB: smartaccounting
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smartpass

    ports:
      - "5441:5432"

    volumes:
      - pgdata-dev:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smartaccounting"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartaccounting-redis-dev

    ports:
      - "6381:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: smartaccounting-backend-dev

    environment:
      NODE_ENV: development
      PORT: 5001
      HOST: 0.0.0.0
      API_BASE_URL: /api

      USE_SQLITE: "false"
      DATABASE_URL: postgres://smart:smartpass@db:5432/smartaccounting
      REDIS_URL: redis://redis:6379
      CACHE_TTL: "3600"

      DEMO_MODE: "true"
      ALLOW_DEMO_SEED: "true"
      ALLOW_PROD_MIGRATION: "true"

      FRONTEND_URL: http://localhost:5173
      CLIENT_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173

      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"

      JWT_SECRET: dev_jwt_secret_please_change_later_123456

      AI_ASSISTANT_ENABLED: "true"
      BANK_IMPORT_ENABLED: "true"
      EXPORTS_ENABLED: "true"
      OCR_PREVIEW_ENABLED: "true"

      LOG_LEVEL: debug
      REQUEST_LOGGING: "true"

      EMAIL_ENABLED: "false"

    ports:
      - "5001:5001"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - .:/usr/src/app
      - backend-node-modules:/usr/src/app/node_modules
      - ./logs:/usr/src/app/logs
      - ./uploads:/usr/src/app/uploads
      - ./temp:/usr/src/app/temp

    restart: unless-stopped

    command: >
      sh -lc "npm run db:migrate &&
              npm run seed:demo:prod &&
              npm run backend:dev"

volumes:
  pgdata-dev:
  backend-node-modules:
