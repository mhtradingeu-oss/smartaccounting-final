services:
  db:
    image: postgres:16
    container_name: smartaccounting-db

    environment:
      POSTGRES_DB: smartaccounting_prod
      POSTGRES_USER: smartaccounting
      POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartaccounting"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  backend:
    container_name: smartaccounting-backend

    build:
      context: .
      dockerfile: Dockerfile.backend

    env_file:
      - .env.production

    environment:
      NODE_ENV: production

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./logs:/usr/src/app/logs
      - ./temp:/usr/src/app/temp

    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    container_name: smartaccounting-frontend

    build:
      context: ./client

    environment:
      VITE_API_URL: /api

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    # ❌ DO NOT expose directly in real production
    # Use nginx or reverse proxy instead
    # ports:
    #   - "8080:80"

volumes:
  pgdata:
